<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Multimedia Page</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header>
        <h1>My Multimedia Page</h1>
        <p>Welcome to my multimedia collection!</p>
    </header>


    <main>

        <!-- =========================
             PHOTOS
        ========================== -->
        <section class="section">

            <h2>My Photos</h2>

            <div class="photo-container">

                <h2>5 Photos</h2>

                <img src="img/jem.jpg" alt="Photo 1">
                <img src="img/jem2.jpg" alt="Photo 2">
                <img src="img/jem3.jpg" alt="Photo 3">
                <img src="img/jem4.jpg" alt="Photo 4">
                <img src="img/jem5.jpg" alt="Photo 5">

                <hr>

            </div>

        </section>


        <!-- =========================
             AUDIO
        ========================== -->
        <section class="section">

            <h2>My Audio Clips</h2>

            <div class="audio-container">


                <!-- AUDIO 1 -->
                <div class="media-card">

                    <h3>Audio 1</h3>

                    <audio controls>
                        <source src="img/m1.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>

                </div>


                <!-- AUDIO 2 -->
                <div class="media-card">

                    <h3>Audio 2</h3>

                    <audio controls>
                        <source src="img/m2.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>

                </div>


                <!-- AUDIO 3 -->
                <div class="media-card">

                    <h3>Audio 3</h3>

                    <audio controls>
                        <source src="img/m3.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>

                </div>


                <!-- AUDIO 4 -->
                <div class="media-card">

                    <h3>Audio 4</h3>

                    <audio controls>
                        <source src="img/m4.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>

                </div>


                <!-- AUDIO 5 -->
                <div class="media-card">

                    <h3>Audio 5</h3>

                    <audio controls>
                        <source src="img/m5.mp3" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>

                </div>


            </div>

        </section>


        <!-- =========================
             VIDEOS
        ========================== -->
        <section class="section">

            <h2 class="section-title">
                My Favorite Video Clips
            </h2>


            <!-- VIDEO 1 -->
            <div class="content">

                <h3>Video 1</h3>

                <video controls width="400">
                    <source src="img/video1.mp4" type="video/mp4">
                    Your browser does not support the video element.
                </video>

            </div>


            <!-- VIDEO 2 -->
            <div class="content">

                <h3>Video 2</h3>

                <video controls width="400">
                    <source src="img/video2.mp4" type="video/mp4">
                    Your browser does not support the video element.
                </video>

            </div>


            <!-- VIDEO 3 -->
            <div class="content">

                <h3>Video 3</h3>

                <video controls width="400">
                    <source src="img/video3.mp4" type="video/mp4">
                    Your browser does not support the video element.
                </video>

            </div>


            <!-- VIDEO 4 -->
            <div class="content">

                <h3>Video 4</h3>

                <video controls width="400">
                    <source src="img/video4.mp4" type="video/mp4">
                    Your browser does not support the video element.
                </video>

            </div>


            <!-- VIDEO 5 -->
            <div class="content">

                <h3>Video 5</h3>

                <video controls width="400">
                    <source src="img/video5.mp4" type="video/mp4">
                    Your browser does not support the video element.
                </video>

            </div>

        </section>

    </main>

</body>

</html>
